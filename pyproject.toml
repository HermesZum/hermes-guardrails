[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hermes-guardrails"
version = "1.0.0"
description = "Security guardrails plugin for Hermes Agent — PII detection, code safety, audit logging"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "agent-community"}]

[tool.setuptools.packages.find]
include = ["guardrails*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"